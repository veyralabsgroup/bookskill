[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookskill"
version = "1.0.0"
description = "Convert books and documents into structured, on-demand agent skills, with incremental re-generation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/veyralabsgroup/bookskill"
Changelog = "https://github.com/veyralabsgroup/bookskill/blob/master/CHANGELOG.md"

[project.scripts]
bookskill = "bookskill.cli:main"

[project.optional-dependencies]
epub = ["ebooklib", "beautifulsoup4"]
pdf = ["pypdf", "pdfminer.six"]
docx = ["python-docx"]
rtf = ["striprtf"]
technical = ["docling"]
all = [
    "ebooklib",
    "beautifulsoup4",
    "pypdf",
    "pdfminer.six",
    "python-docx",
    "striprtf",
    "docling"
]


# Tooling config so `ruff check .` and `pytest` locally match CI without flags.
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# High-value gate only: syntax errors (E9) + pyflakes (F). Style stays ungated.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
