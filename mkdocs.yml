site_name: bookskill
site_description: >-
  Turn any book, PDF or EPUB into a structured agent skill for Claude Code,
  GitHub Copilot CLI and Amp — frameworks and decision rules, loaded on demand.
site_url: https://veyralabsgroup.github.io/bookskill/
repo_url: https://github.com/veyralabsgroup/bookskill
repo_name: veyralabsgroup/bookskill
edit_uri: ""

# index.md is a committed landing page. Guide (README.md) and Skill Reference
# (SKILL.md) are assembled from the repo root at build time, so prose docs stay
# single-source. See .github/workflows/deploy-docs.yml.

theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Guide: guide.md
  - How it works: how-it-works.md
  - Usage: usage.md
  - Install: install.md
  - FAQ: faq.md
  - Architecture: architecture.md
  - Performance: performance.md
  - Skill Reference: skill-reference.md

plugins:
  # `search` is on by default, but naming any plugin replaces the default list.
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
